run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - copyloopvar
    - unconvert
    - misspell

issues:
  exclude-dirs:
    - internal/protocol # generated
    - frontend
    - tmp
  exclude-rules:
    # Test setup calls fail the test at the assertion that follows.
    - path: _test\.go
      linters:
        - errcheck
