syntax = "proto3";

package dropz;
option go_package = "github.com/dropz/dropz/internal/protocol";

import "common.proto";
import "google/protobuf/timestamp.proto";

// Base Camera type with common properties
message Camera {
  string id = 1;
  string name = 2;
  string alias = 3;
  string ble_address = 4;
  string wifi_ssid = 5;
  string wifi_password = 6;
  int32 rssi = 7;  // Signal strength in dBm
}

// Camera status information
message CameraStatus {
  google.protobuf.Timestamp last_seen = 1;
  google.protobuf.Timestamp last_synced = 2;
  bool is_pairing = 3;
  bool is_paired = 4;
  bool is_managed = 5;
  bool is_reachable = 6;
  bool is_synced = 7;
  bool is_syncing = 8;
  string last_sync_error = 9;
  // Camera-side pairing UI flag, read from BLE advertising data
  bool in_pairing_mode = 10;
  // Keep a preview session up whenever the camera is in range
  bool preview_enabled = 11;
  // Files on the card beyond the last completed sync's baseline; 0 when
  // unknown or up to date. Derived, never stored.
  int32 new_media_count = 12;
}

// Additional technical metadata about a camera
message CameraMetadata {
  string id = 1;  // References the camera ID
  string firmware_version = 2;
  string model = 3;
  string serial_number = 4;
  int32 battery_level = 5;  // percentage
  string hardware_version = 7;
  int32 num_photos = 8;
  int32 num_videos = 9;
  int32 sd_card_status = 10;
  int64 remaining_space_kb = 11;
}

// Complete camera with all its information
message CameraWithState {
  Camera camera = 1;
  CameraStatus status = 2;
  string group_id = 3;
  CameraMetadata metadata = 4;
}

// Discovered cameras - cameras that are not managed or paired
message DiscoveredCamera {
  CameraWithState camera_state = 1;
}

// Managed Camera (Camera Pool) - managed and paired cameras
message ManagedCamera {
  CameraWithState camera_state = 1;
}

// Per-file transfer state, streamed while a sync runs and kept in history.
enum SyncFileState {
  SYNC_FILE_QUEUED = 0;
  SYNC_FILE_DOWNLOADING = 1;
  SYNC_FILE_DONE = 2;
  SYNC_FILE_FAILED = 3;
  SYNC_FILE_SKIPPED = 4;  // already in the library
}

message SyncFile {
  string name = 1;
  string camera_path = 2;
  int64 size_bytes = 3;
  SyncFileState state = 4;
  int64 bytes_done = 5;
  string error = 6;
  string local_path = 7;  // set once done or skipped
  int64 duration_ms = 8;  // transfer time once done
}

// User-facing phases; the backend steps collapse onto these four.
enum SyncPhase {
  SYNC_PHASE_WAITING = 0;
  SYNC_PHASE_CONNECT = 1;
  SYNC_PHASE_LINK = 2;
  SYNC_PHASE_CATALOG = 3;
  SYNC_PHASE_TRANSFER = 4;
}

message SyncPhaseTiming {
  SyncPhase phase = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;  // unset while the phase runs
}

// Sync Queue Entry
message SyncQueueEntry {
  string camera_id = 1;  // References the camera ID
  google.protobuf.Timestamp queued_at = 2;
  int32 priority = 3;  // Higher numbers = higher priority (manual sync = 10, auto sync = 5)
  int32 progress_percent = 4;
  string current_operation = 5;  // Text description of current operation
  // Download detail, present only while the download step runs.
  // Byte fields are 0 when the camera did not report sizes.
  int32 file_index = 6;  // 1-based, among the files actually downloading
  int32 file_count = 7;
  string file_name = 8;
  int64 file_bytes = 9;  // current file bytes on disk
  int64 file_total = 10;
  int64 bytes_done = 11;  // whole sync
  int64 bytes_total = 12;
  int64 rate_bps = 13;  // smoothed recent throughput
  google.protobuf.Timestamp started_at = 14;  // unset while waiting in the queue
  SyncPhase phase = 15;
  repeated SyncPhaseTiming phases = 16;
  // Every file the transfer step considered, in card order; empty before
  // the media list is known.
  repeated SyncFile files = 17;
  int32 step_index = 18;  // 1-based backend step, for failure messages
  int32 step_count = 19;
}

// One finished sync, kept so the outcome outlives the queue entry.
enum SyncOutcome {
  SYNC_OUTCOME_UNSPECIFIED = 0;
  SYNC_OUTCOME_COMPLETE = 1;
  SYNC_OUTCOME_UP_TO_DATE = 2;
  SYNC_OUTCOME_CATALOG_REFRESHED = 3;
  SYNC_OUTCOME_FAILED = 4;
  SYNC_OUTCOME_CANCELLED = 5;
}

message SyncSession {
  string id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  SyncOutcome outcome = 5;
  string error = 6;        // user-visible, failed only
  string failed_step = 7;  // backend step label, failed only
  int32 step_index = 8;
  int32 step_count = 9;
  int32 files_downloaded = 10;
  int32 files_failed = 11;
  int32 files_skipped = 12;
  int64 bytes_downloaded = 13;
  repeated SyncFile files = 14;
  repeated SyncPhaseTiming phases = 15;
  bool selection = 16;  // media browser pick or catalog refresh, not a full sync
}

message GetSyncHistoryRequest {
  int32 limit = 1;      // 0 = server default
  string camera_id = 2; // empty = all cameras
}

message GetSyncHistoryResponse {
  repeated SyncSession sessions = 1;
}

message SetCameraAliasRequest {
  string camera_id = 1;
  string alias = 2;  // empty clears the alias
}

message SetCameraAliasResponse {
  CameraWithState camera = 1;
}

// Group of cameras
message Group {
  string id = 1;
  string name = 2;
  repeated string camera_ids = 3;  // References to managed cameras
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Request to get all discovered cameras
message GetDiscoveredCamerasRequest {
  int64 change_counter = 1; // Client's current change counter, used for change tracking
}

// Response with all discovered cameras
message GetDiscoveredCamerasResponse {
  repeated DiscoveredCamera cameras = 1;
  int64 change_counter = 2; // Server's current change counter
  bool no_changes = 3;     // True if no changes since the client's counter
  bool heartbeat = 4;      // True if this is just a keepalive ping
}

// Request to get cameras in the pool (managed and paired)
message GetManagedCamerasRequest {
  int64 change_counter = 1; // Client's current change counter, used for change tracking
}

// Response with all managed cameras
message GetManagedCamerasResponse {
  repeated ManagedCamera cameras = 1;
  int64 change_counter = 2; // Server's current change counter
  bool no_changes = 3;     // True if no changes since the client's counter
  bool heartbeat = 4;      // True if this is just a keepalive ping
}

// Request to get the sync queue
message GetSyncQueueRequest {
  int64 change_counter = 1; // Client's current change counter, used for change tracking
}

// Response with the sync queue
message GetSyncQueueResponse {
  repeated SyncQueueEntry queue = 1;
  int64 change_counter = 2; // Server's current change counter
  bool no_changes = 3;     // True if no changes since the client's counter
  bool heartbeat = 4;      // True if this is just a keepalive ping
}

// Request to manage a specific camera (add to camera pool)
message ManageCameraRequest {
  string camera_id = 1;
}

// Response for manage request
message ManageCameraResponse {
  bool success = 1;
  string message = 2;
  ManagedCamera camera = 3;
}

// Request to stop managing a specific camera
message UnmanageCameraRequest {
  string camera_id = 1;
}

// Response for unmanage request
message UnmanageCameraResponse {
  bool success = 1;
  string message = 2;
}

// Request to pair a specific camera
message PairCameraRequest {
  string camera_id = 1;
}

// Response for pair request
message PairCameraResponse {
  bool success = 1;
  string message = 2;
  ManagedCamera camera = 3;
}

// Request to sync a specific camera
message ForceSyncRequest {
  string camera_id = 1;
}

// Response for force sync request
message ForceSyncResponse {
  bool success = 1;
  string message = 2;
  SyncQueueEntry queue_entry = 3;
}

// Request to cancel sync for a specific camera
message CancelSyncRequest {
  string camera_id = 1;
}

// Response for cancel sync request
message CancelSyncResponse {
  bool success = 1;
  string message = 2;
}

// Group related requests and responses
message GetGroupsRequest {}

message GetGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string name = 1;
  repeated string camera_ids = 2;
}

message UpdateGroupRequest {
  string group_id = 1;
  string name = 2;
  repeated string camera_ids = 3;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message LoadGroupRequest {
  string group_id = 1;
}

message LoadGroupResponse {
  bool success = 1;
  string message = 2;
}

message SaveManagedAsGroupRequest {
  string name = 1;
}
// Camera settings, refreshed over BLE. Options list only what the camera
// reported as available: per-model support comes from the camera itself.
message SettingOption {
  int64 value = 1;
  string name = 2;
}

message CameraSetting {
  int32 id = 1;
  string name = 2;
  int64 value = 3;
  string value_name = 4;
  repeated SettingOption options = 5;
}

message SettingChange {
  int32 id = 1;
  int64 value = 2;
}

message SettingApplyResult {
  int32 id = 1;
  string error = 2; // empty = applied
}

message CameraSettingsResult {
  string camera_id = 1;
  string error = 2; // whole-camera failure; empty otherwise
  repeated SettingApplyResult results = 3;
}

message GetCameraSettingsRequest {
  string camera_id = 1;
  bool refresh = 2; // true = read from the camera over BLE
}

message GetCameraSettingsResponse {
  repeated CameraSetting settings = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message ApplyCameraSettingsRequest {
  string camera_id = 1; // exactly one of camera_id / group_id
  string group_id = 2;
  repeated SettingChange changes = 3;
}

message ApplyCameraSettingsResponse {
  repeated CameraSettingsResult cameras = 1;
}

// Media browser: cached catalog of what is on a camera, captured at sync.
message CameraMediaItem {
  string name = 1;
  string camera_path = 2;
  int64 size_bytes = 3;
  google.protobuf.Timestamp created_at = 4;
  string thumbnail_path = 5; // absolute local path, empty if not cached
  bool downloaded = 6;
  string local_path = 7;   // absolute local path once downloaded
  string preview_path = 8; // cached LRV proxy, empty until previewed
}

message GetCameraMediaRequest {
  string camera_id = 1;
}

message GetCameraMediaResponse {
  repeated CameraMediaItem items = 1;
  google.protobuf.Timestamp updated_at = 2; // when the catalog was captured
}

// Ask for a clip's low-res LRV proxy to be fetched into the preview
// cache, opening a short camera session on demand.
message PreviewMediaRequest {
  string camera_id = 1;
  string camera_path = 2;
}

message PreviewMediaResponse {}

// Arm or disarm the standing preview session for a camera. Arming is an
// intent: the session comes up when the camera is in range and the radio
// is free, and only one camera can be armed at a time.
message SetPreviewSessionRequest {
  string camera_id = 1;
  bool enabled = 2;
}

message SetPreviewSessionResponse {}

// Generate (or reuse) the in-app playable preview of a library file.
// Synchronous: answers once the preview exists.
message PreviewVideoRequest {
  string video_path = 1;
}

message PreviewVideoResponse {
  string preview_path = 1;
}

message RequestMediaDownloadRequest {
  string camera_id = 1;
  // Empty = refresh the catalog and thumbnails without downloading.
  repeated string file_names = 2;
}

message RequestMediaDownloadResponse {
  SyncQueueEntry entry = 1;
}
