syntax = "proto3";

package dropz;
option go_package = "github.com/dropz/dropz/pkg/protocol";

import "google/protobuf/timestamp.proto";

// Log entry
message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string level = 2;
  string message = 3;
  string camera_id = 4;  // References the camera ID if applicable
  string component = 5;  // Component that generated the log
  string source_file = 6; // Source file that generated the log
  int32 line_number = 7;  // Line number in source file
}

// Request to get logs
message GetLogsRequest {
  string level = 1;  // Optional: filter by log level
  string camera_id = 2;  // Optional: filter by camera ID
  string component = 3;  // Optional: filter by component
  google.protobuf.Timestamp start_time = 4;  // Optional: time range start
  google.protobuf.Timestamp end_time = 5;    // Optional: time range end
  int32 limit = 6;  // Maximum number of logs to return
  int32 offset = 7; // Pagination offset
}

// Response with logs
message GetLogsResponse {
  repeated LogEntry logs = 1;
  int32 total_count = 2;  // Total count for pagination
} 