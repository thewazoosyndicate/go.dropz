syntax = "proto3";

package dropz;
option go_package = "github.com/dropz/dropz/internal/protocol";

import "google/protobuf/timestamp.proto";

// Video file metadata
message VideoFile {
  string id = 1;
  string name = 2;
  string path = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp synced_at = 6;
  string camera_id = 7;  // References the camera that recorded this video
  string mime_type = 8;
  int32 duration_seconds = 9;
  string thumbnail_path = 10;
  bool has_processed = 11;
  string preview_path = 12; // cached in-app playable WebM, empty until generated
}

// Request to get all downloaded videos
message GetVideosRequest {
  string camera_id = 1;  // Optional: filter by camera
  google.protobuf.Timestamp start_date = 2;  // Optional: filter by date range
  google.protobuf.Timestamp end_date = 3;    // Optional: filter by date range
  int32 limit = 4;  // Optional: limit number of results
  int32 offset = 5; // Optional: pagination offset
}

// Response with all downloaded videos
message GetVideosResponse {
  repeated VideoFile videos = 1;
  int32 total_count = 2;  // Total count for pagination
}

// Keyframe positions of a library clip, read from its sample tables.
// A lossless trim can only start on one of these.
message GetVideoKeyframesRequest {
  string video_path = 1;
}

message GetVideoKeyframesResponse {
  repeated int64 keyframe_ms = 1;
  int64 duration_ms = 2;
}

// Lossless cut of a library clip into a new file next to it.
message TrimVideoRequest {
  string video_path = 1;
  int64 start_ms = 2;  // snapped to the keyframe at or before
  int64 end_ms = 3;    // 0 = end of clip
}

message TrimVideoResponse {
  string output_path = 1;
  string name = 2;
  string thumbnail_path = 3;  // empty when the thumbnail could not be made
  string preview_path = 4;    // empty when the source had no proxy
  int64 size_bytes = 5;
  int64 start_ms = 6;         // where the cut really starts
  int64 end_ms = 7;
} 